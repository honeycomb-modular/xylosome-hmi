<rect x="70" y="678" width="200" height="42" fill="none" stroke="#4ADE80" stroke-dasharray="4 3" rx="3"/><text x="82" y="704" class="t" fill="#4ADE80">SCAN AXIS — line sweep</text>
<text x="236" y="566" class="s" font-size="10">17-bit abs encoder &#8594;</text><text x="236" y="580" class="s" font-size="10">drive (EtherCAT)</text>

<path d="M400,488 L400,548" class="emech" marker-end="url(#aGr)"/>
<rect x="330" y="548" width="174" height="86" class="box" rx="3"/><text x="342" y="574" class="t" font-size="13">Filter wheel</text>
<circle cx="350" cy="598" r="7" fill="#CC4444"/><text x="346" y="602" font-size="9" fill="#070707">R</text>
<circle cx="378" cy="598" r="7" fill="#44CC44"/><text x="374" y="602" font-size="9" fill="#070707">G</text>
<circle cx="406" cy="598" r="7" fill="#4488CC"/><text x="402" y="602" font-size="9" fill="#070707">B</text>
<circle cx="434" cy="598" r="7" fill="#AAAAAA"/><text x="430" y="602" font-size="9" fill="#070707">C</text>
<text x="342" y="624" class="s" font-size="10">4-pass · in camera optical path</text>

<path d="M744,548 L744,490" class="emech" marker-end="url(#aGr)"/>
<rect x="664" y="548" width="170" height="46" class="box" rx="3"/><text x="676" y="576" class="t" font-size="12">home · endstop · E-stop</text>

<path d="M486,404 L486,348 L930,348 L936,314" class="esig" marker-end="url(#aR)"/>
<text x="540" y="342" class="lab" fill="#F87171">line-trigger pulse · rate &#8733; curve  (creative axis)</text>
<path d="M226,420 L240,420 L240,368 L930,368 L936,322" class="esig" marker-end="url(#aR)" opacity="0.8"/>
<text x="540" y="382" class="lab" fill="#F87171" opacity="0.85">encoder-echo A/B · locked mode (optional)</text>
<text x="628" y="470" class="s" font-size="10">&#8594; pass / index</text>

<rect x="40" y="752" width="1400" height="92" class="panel" rx="6"/><text x="52" y="772" class="zl">POWER</text>
<rect x="80" y="782" width="180" height="46" class="box" rx="3"/><text x="92" y="810" class="t" font-size="13">230 VAC · 1-phase</text>
<text x="276" y="800" class="sm">&#8594; A6-EC servo drive</text>
<rect x="560" y="782" width="170" height="46" class="box" rx="3"/><text x="572" y="810" class="t" font-size="13">24 VDC PSU</text>
<text x="746" y="800" class="sm">&#8594; C6920 · EL terminals · filter-wheel stepper</text>

<rect x="40" y="868" width="690" height="142" class="panel" rx="6"/><text x="56" y="892" class="t" fill="#4ADE80">THREE CONTROL AXES</text>
<text x="56" y="918" class="sm" fill="#ECECEC">1 · motion speed — speed curve drives the servo</text>
<text x="56" y="942" class="sm" fill="#ECECEC">2 · line rate — EL2521 pulse mapped to the curve</text>
<text x="76" y="962" class="s">geometry &#8596; sampling : the new creative axis</text>
<text x="56" y="986" class="sm" fill="#ECECEC">3 · exposure — set on camera, independent &#8594; brightness</text>

<rect x="740" y="868" width="700" height="142" class="panel" rx="6"/><text x="756" y="892" class="t" fill="#F87171">OPEN ITEMS / TO VERIFY</text>
<text x="756" y="918" class="sm">· gearhead &#8596; servo flange — fit / adapter plate</text>
<text x="756" y="942" class="sm">· smooth CiA-402 — PREEMPT_RT or LinuxCNC-ethercat</text>
<text x="756" y="966" class="sm">· A6-EC encoder-echo (A/B) output — for locked mode</text>
<text x="756" y="990" class="sm">· capture PC hosts frame grabber (PCIe) — stays separate</text>
