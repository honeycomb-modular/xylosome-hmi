<text x="40" y="44" class="t" font-size="22" fill="#4ADE80">XYLOSOME · Beckhoff EtherCAT Architecture</text>
<text x="40" y="68" class="sm" fill="#888">Line-scan camera — StepperOnline servo + Beckhoff EtherCAT I/O — Pi HMI retained</text>

<rect x="980" y="22" width="460" height="64" class="panel" rx="6"/>
<line x1="995" y1="44" x2="1018" y2="44" class="eecat"/><text x="1024" y="48" class="lab">EtherCAT</text>
<line x1="1150" y1="44" x2="1173" y2="44" class="elan"/><text x="1179" y="48" class="lab">Ethernet/TCP</text>
