name: suite

on:
  push:
    paths:
      - "suite/**"
      - ".github/workflows/suite.yml"
  pull_request:
    paths:
      - "suite/**"
      - ".github/workflows/suite.yml"

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.*"
          cache: true

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev libxkbcommon-dev libvips-dev

      - name: Install libvips (macOS)
        if: runner.os == 'macOS'
        run: brew install vips pkgconf

      # arm64-only: brew's libvips is single-arch, a universal app can't
      # link it. Intel Macs would need a separate x86_64 job with x86 brew.
      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: >
          cmake -S suite -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
          -DCMAKE_OSX_ARCHITECTURES=arm64

      - name: Configure
        if: runner.os != 'macOS'
        run: cmake -S suite -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir dist
          cp -R build/xylosome-suite.app dist/
          macdeployqt dist/xylosome-suite.app -qmldir=suite/qml -dmg
          mv dist/xylosome-suite.dmg "dist/Xylosome Suite.dmg"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cp build/xylosome-suite dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xylosome-suite-${{ runner.os }}
          path: dist/

  # Windows on msys2/UCRT64: Qt 6 and libvips are both native packages of
  # the same toolchain — no MSVC ⇄ MinGW import-lib archaeology (see
  # suite/NEXT_SESSION.md for the history). Ingest enabled.
  build-windows:
    name: windows-msys2
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-declarative
            mingw-w64-ucrt-x86_64-qt6-svg
            mingw-w64-ucrt-x86_64-qt6-tools
            mingw-w64-ucrt-x86_64-libvips

      # .pc files say /ucrt64/...; Windows CMake needs real paths.
      - name: Relocate pkgconfig prefixes
        run: |
          p=$(cygpath -m /ucrt64)
          sed -i "s|/ucrt64|$p|g" /ucrt64/lib/pkgconfig/*.pc
          pkg-config --cflags-only-I vips

      - name: Configure
        run: cmake -S suite -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Package
        run: |
          mkdir -p dist
          cp build/xylosome-suite.exe dist/
          WDQ=$(command -v windeployqt-qt6 || command -v windeployqt6 || command -v windeployqt)
          "$WDQ" --qmldir suite/qml --release dist/xylosome-suite.exe
          # windeployqt covers Qt; pull the rest of the DLL chain (vips,
          # glib, jpeg, …) from the dependency list.
          ldd dist/xylosome-suite.exe | grep -io '/ucrt64/bin/[^ ]*\.dll' | sort -u \
            | xargs -r -I{} cp -n {} dist/ || true
          # vips loads image format support at runtime too — take every
          # ucrt64 DLL that any copied DLL depends on (one transitive pass).
          for f in dist/*.dll; do
            ldd "$f" 2>/dev/null | grep -io '/ucrt64/bin/[^ ]*\.dll' || true
          done | sort -u | xargs -r -I{} cp -n {} dist/ || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xylosome-suite-Windows
          path: dist/
