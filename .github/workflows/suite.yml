name: suite

on:
  push:
    paths:
      - "suite/**"
      - ".github/workflows/suite.yml"
  pull_request:
    paths:
      - "suite/**"
      - ".github/workflows/suite.yml"

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.*"
          cache: true

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev libxkbcommon-dev libvips-dev

      - name: Install libvips (macOS)
        if: runner.os == 'macOS'
        run: brew install vips pkgconf

      - name: Export GitHub Actions cache env for vcpkg
        if: runner.os == 'Windows'
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install libvips (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install -y pkgconfiglite
          vcpkg install libvips:x64-windows
          "PKG_CONFIG_PATH=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\lib\pkgconfig" `
            | Out-File -FilePath $env:GITHUB_ENV -Append
          "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin" `
            | Out-File -FilePath $env:GITHUB_PATH -Append
        env:
          VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: >
          cmake -S suite -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
          "-DCMAKE_OSX_ARCHITECTURES=x86_64;arm64"

      - name: Configure
        if: runner.os != 'macOS'
        run: cmake -S suite -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          mkdir dist
          Copy-Item build/Release/xylosome-suite.exe dist/
          windeployqt --qmldir suite/qml --release dist/xylosome-suite.exe
          if (Test-Path "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin") {
            Copy-Item "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin\*.dll" dist/
          }

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir dist
          cp -R build/xylosome-suite.app dist/
          macdeployqt dist/xylosome-suite.app -qmldir=suite/qml -dmg
          mv dist/xylosome-suite.dmg "dist/Xylosome Suite.dmg"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cp build/xylosome-suite dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xylosome-suite-${{ runner.os }}
          path: dist/
