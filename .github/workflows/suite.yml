name: suite

on:
  push:
    paths:
      - "suite/**"
      - ".github/workflows/suite.yml"
  pull_request:
    paths:
      - "suite/**"
      - ".github/workflows/suite.yml"

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.*"
          cache: true

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev libxkbcommon-dev libvips-dev

      - name: Install libvips (macOS)
        if: runner.os == 'macOS'
        run: brew install vips pkgconf

      - name: Install libvips (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install -y pkgconfiglite
          $v = "8.18.3"
          Invoke-WebRequest `
            "https://github.com/libvips/build-win64-mxe/releases/download/v$v/vips-dev-x64-all-$v.zip" `
            -OutFile vips.zip
          Expand-Archive vips.zip -DestinationPath C:\vips
          $root = (Get-ChildItem C:\vips -Directory | Select-Object -First 1).FullName
          # Relocate the .pc files: they still carry the MXE build prefix.
          $rootFwd = $root -replace '\\','/'
          Get-ChildItem "$root\lib\pkgconfig\*.pc" | ForEach-Object {
            (Get-Content $_.FullName) `
              -replace '/usr/local/mxe/usr/x86_64-w64-mingw32\.shared', $rootFwd `
              | Set-Content $_.FullName
          }
          # The .pc may reference include dirs the zip doesn't ship
          # (e.g. librsvg-2.0); CMake rejects imported targets with
          # missing paths — create the empty dirs.
          $env:PKG_CONFIG_PATH = "$root\lib\pkgconfig"
          (pkg-config --cflags-only-I vips) -split '\s+' |
            Where-Object { $_ -like '-I*' } |
            ForEach-Object { New-Item -ItemType Directory -Force $_.Substring(2) | Out-Null }
          # MSVC wants foo.lib; MinGW ships libfoo.dll.a — alias every lib
          # the .pc asks for.
          (pkg-config --libs-only-l vips) -split '\s+' |
            Where-Object { $_ -like '-l*' } |
            ForEach-Object {
              $n = $_.Substring(2)
              $target = "$root\lib\$n.lib"
              if (-not (Test-Path $target)) {
                foreach ($cand in @("lib$n.lib","lib$n.dll.a","$n.dll.a","lib$n.a")) {
                  if (Test-Path "$root\lib\$cand") {
                    Copy-Item "$root\lib\$cand" $target; break
                  }
                }
              }
            }
          # Strip -l entries that still have no .lib (e.g. -lintl: its
          # symbols live inside glib's DLL here; safe to drop for dynamic
          # linking). Applied to every .pc in the chain.
          Get-ChildItem "$root\lib\pkgconfig\*.pc" | ForEach-Object {
            $lines = Get-Content $_.FullName | ForEach-Object {
              if ($_ -match '^Libs') {
                (($_ -split ' ') | Where-Object {
                  -not ($_ -like '-l*') -or
                  (Test-Path "$root\lib\$($_.Substring(2)).lib")
                }) -join ' '
              } else { $_ }
            }
            Set-Content $_.FullName $lines
          }
          Write-Host "final vips Libs:"
          Select-String '^Libs' "$root\lib\pkgconfig\vips.pc"
          Write-Host "lib dir:"
          (Get-ChildItem "$root\lib" -File | Select-Object -ExpandProperty Name) -join "  "
          "VIPS_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PKG_CONFIG_PATH=$root\lib\pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$root\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      # arm64-only: brew's libvips is single-arch, a universal app can't
      # link it. Intel Macs would need a separate x86_64 job with x86 brew.
      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: >
          cmake -S suite -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
          -DCMAKE_OSX_ARCHITECTURES=arm64

      - name: Configure
        if: runner.os != 'macOS'
        run: cmake -S suite -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          mkdir dist
          Copy-Item build/Release/xylosome-suite.exe dist/
          windeployqt --qmldir suite/qml --release dist/xylosome-suite.exe
          if ($env:VIPS_ROOT -and (Test-Path "$env:VIPS_ROOT\bin")) {
            Copy-Item "$env:VIPS_ROOT\bin\*.dll" dist/
          }

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir dist
          cp -R build/xylosome-suite.app dist/
          macdeployqt dist/xylosome-suite.app -qmldir=suite/qml -dmg
          mv dist/xylosome-suite.dmg "dist/Xylosome Suite.dmg"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cp build/xylosome-suite dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xylosome-suite-${{ runner.os }}
          path: dist/
