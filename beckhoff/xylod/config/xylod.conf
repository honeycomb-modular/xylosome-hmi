# xylod.conf — Xylosome motion daemon, Beckhoff C6920
# Copy to /etc/xylod.conf. key = value, '#' comments.

# ── network ───────────────────────────────────────────────────────────────────
tcp_port = 5510
ec_iface = eth1          # MAC1 — the EtherCAT port. `ip a` to confirm naming.

# ── EtherCAT bus positions (1-based — confirm with ec_scan) ───────────────────
pos_drive  = 1           # A6-EC servo drive
pos_ek1100 = 2
pos_el7031 = 3
pos_el2521 = 4
pos_el5152 = 5
pos_el_dout = 6
pos_el_din  = 7

# ── scan axis ─────────────────────────────────────────────────────────────────
motor_counts_per_rev = 131072      # 17-bit absolute encoder
gear_ratio           = 50          # harmonic drive
invert_axis          = false
acc_limit_degs2      = 400
home_deg             = 0
home_vel_degs        = 10
soft_min_deg         = -10
soft_max_deg         = 200

# ── filter wheel (EL7031) ─────────────────────────────────────────────────────
fw_steps_per_rev = 12800           # 200 full steps × 64 µsteps — adjust to wiring
fw_vel_steps_s   = 4000
fw_acc_steps_s2  = 16000
fw_slot_r = 0.00                   # slot positions, fraction of one wheel rev
fw_slot_g = 0.25
fw_slot_b = 0.50
fw_slot_c = 0.75

# ── line trigger (EL2521) ─────────────────────────────────────────────────────
el2521_base_hz = 50000             # must match CoE 0x8000:02 on the terminal
line_max_hz    = 20000

# ── digital I/O bit map ───────────────────────────────────────────────────────
di_home     = 0
di_end_min  = 1
di_end_max  = 2
di_estop    = 3
di_fw_index = 4
do_pass_active = 0
do_pass_index  = 1
estop_active_low = true            # wire E-stop normally-closed: LOW = tripped

# ── control loop ──────────────────────────────────────────────────────────────
cycle_us = 1000                    # 1 kHz
rt_prio  = 60                      # SCHED_FIFO; 0 disables RT scheduling
