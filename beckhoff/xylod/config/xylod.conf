# xylod.conf — Xylosome motion daemon, Beckhoff C6920
# Copy to /etc/xylod.conf. key = value, '#' comments.
#
# This IS /etc/xylod.conf on the C6920 (synced 2026-10-17). Rail per ec_scan:
#   1 EK1100  2 EL1008  3 EL2008  4 EL2008  5 EL2521  6 EL7047  7 EL5101
#   8 EL7211-9014 (colour wheel)  9 ANCTL AS715N (A6-EC scan axis)
# The colour stops are NOT here: they live in /var/lib/xylod/colour_stops,
# written by {"cmd":"colour_stops"} (settings > colour on the HMI).

# ── network ───────────────────────────────────────────────────────────────────
tcp_port = 5510
ec_iface = enp4s0        # second NIC — confirmed on the bench

# ── EtherCAT bus positions (1-based; 0 = device NOT fitted) ───────────────────
pos_drive  = 9           # A6-EC servo (enumerates as "ANCTL AS715N")
pos_ek1100 = 1
pos_el7031 = 0           # filter drive: EL7047 sits at 4 but speaks STM PDOs,
                         #   not the EL7031 layout — adaptation pending; OFF.
pos_el2521 = 5           # line-trigger terminal not fitted
pos_el5152 = 0           # encoder echo not fitted
pos_el_dout = 3          # EL2008 — pass_active / pass_index LEDs
pos_el_din  = 0          # EL1008 sits at 2 but E-stop/endstops are NOT wired:
                         #   0 = absent → estopOk defaults safe. Wire before garage!

# ── scan axis ─────────────────────────────────────────────────────────────────
motor_counts_per_rev = 131072      # 17-bit absolute encoder
gear_ratio           = 50          # harmonic drive 50:1 IS fitted (confirmed 2026-06-12)
                                   # HMI degrees = output-flange degrees
invert_axis = true
acc_limit_degs2      = 1500        # raised for fast resets (2026-06-12);
                                   # output-side — motor sees ×50. Unloaded
                                   # flange OK; revisit with camera mass on.
home_deg             = 0
home_vel_degs        = 10
soft_min_deg = -180
soft_max_deg = 180
# NOTE: axis zero = wherever the shaft sits when xylod reaches OP.
# Restart xylod to re-zero. Don't hand-spin the shaft while it runs.

# ── filter wheel (disabled on bench — kept for garage) ────────────────────────
fw_steps_per_rev = 12800
fw_vel_steps_s   = 4000
fw_acc_steps_s2  = 16000
fw_slot_r = 0.00
fw_slot_g = 0.25
fw_slot_b = 0.50
fw_slot_c = 0.75

# ── line trigger (disabled on bench) ──────────────────────────────────────────
el2521_base_hz = 50000
line_max_hz    = 37000
# line_min_hz = 100     # colour passes are never slowed below this; the rest is camera gain

# ── digital I/O bit map (din disabled on bench) ───────────────────────────────
di_home     = 0
di_end_min  = 1
di_end_max  = 2
di_estop    = 3
di_fw_index = 4
do_pass_active = 0
do_pass_index  = 1
estop_active_low = true            # wire E-stop normally-closed: LOW = tripped

# ── control loop ──────────────────────────────────────────────────────────────
cycle_us = 1000                    # 1 kHz — matches drive SYNC0 (C13.05 = 2!)
rt_prio  = 60                      # SCHED_FIFO

# shutdown button — EL1008 slave 2, channel 1
pos_shutdown    = 2
di_shutdown     = 0
shutdown_hold_s = 0.1
line_blink_div = 100
line_blink_ms  = 10
wheel_enable = 1
wheel_vel_gain = 1000
