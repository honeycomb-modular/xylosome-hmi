# xylod.conf — Xylosome motion daemon, Beckhoff C6920
# Copy to /etc/xylod.conf. key = value, '#' comments.
#
# BENCH configuration — actual bus per ec_scan.
# 2026-06-17: EL2521 (line trigger) + EL5101 (encoder) added; drive 6 -> 8:
#   1 EK1100  2 EL1008  3 EL2008  4 EL2008  5 EL2521  6 EL7047  7 EL5101  8 A6-EC
# (was 2026-06-16: 1 EK1100 2 EL1008 3 EL2008 4 EL2008 5 EL7047 6 A6-EC)
# Garage config will differ (gear_ratio 50, filter drive, E-stop wired).

# ── network ───────────────────────────────────────────────────────────────────
tcp_port = 5510
ec_iface = enp4s0        # second NIC — confirmed on the bench

# ── EtherCAT bus positions (1-based; 0 = device NOT fitted) ───────────────────
pos_drive  = 8           # A6-EC servo (enumerates as "ANCTL AS715N") — moved 6->8
pos_ek1100 = 1
pos_el7031 = 0           # filter drive: EL7047 now sits at 6 but speaks STM PDOs,
                         #   not the EL7031 layout — adaptation pending; OFF.
pos_el2521 = 0           # EL2521 line trigger now FITTED at pos 5 — enable when
                         #   the line-trigger driving code is ready (off for now).
pos_el5152 = 0           # EL5101 encoder iface now FITTED at pos 7 — note: it's an
                         #   EL5101, not EL5152; adapt before enabling. Off for now.
pos_el_dout = 3          # 1st EL2008 — pass_active / pass_index LEDs
                         #   (2nd EL2008 at pos 4, unused for now)
pos_el_din  = 0          # EL1008 sits at 2 but E-stop/endstops are NOT wired:
                         #   0 = absent → estopOk defaults safe. Wire before garage!

# ── scan axis ─────────────────────────────────────────────────────────────────
motor_counts_per_rev = 131072      # 17-bit absolute encoder
gear_ratio           = 50          # harmonic drive 50:1 IS fitted (confirmed 2026-06-12)
                                   # HMI degrees = output-flange degrees
invert_axis          = true        # 2026-06-27: camera scans to match the on-screen sweep
acc_limit_degs2      = 1500        # raised for fast resets (2026-06-12);
                                   # output-side — motor sees ×50. Unloaded
                                   # flange OK; revisit with camera mass on.
jog_acc_degs2        = 4000        # 2026-06-27: snappy jog / dial-step (separate from scan accel)
home_deg             = 0
home_vel_degs        = 10
soft_min_deg         = -180       # 2026-06-27: home re-centered → symmetric ±180 sweep
soft_max_deg         = 180
# NOTE: axis zero comes from the taught absolute home in home_file (see below) —
# it survives restarts. ONLY if that file is missing does xylod fall back to
# wake-zero (current pose becomes 0°), which gives a different home every start.
# Teach a new zero with [set home] on the HMI, never by restarting.
# soft_min/max are relative to that zero, so re-teaching shifts the envelope.
# Don't hand-spin the shaft while it runs.

# ── filter wheel (disabled on bench — kept for garage) ────────────────────────
fw_steps_per_rev = 12800
fw_vel_steps_s   = 4000
fw_acc_steps_s2  = 16000
fw_slot_r = 0.00
fw_slot_g = 0.25
fw_slot_b = 0.50
fw_slot_c = 0.75

# ── line trigger (disabled on bench) ──────────────────────────────────────────
el2521_base_hz = 50000
line_max_hz    = 20000

# ── digital I/O bit map (din disabled on bench) ───────────────────────────────
di_home     = 0
di_end_min  = 1
di_end_max  = 2
di_estop    = 3
di_fw_index = 4
do_pass_active = 0
do_pass_index  = 1
# line-count blink: pulse EL2008 (pos_el_dout) channel do_line_blink every
# line_blink_div scanned lines for line_blink_ms. Watch the channel's LED first;
# wire a 24 V light to that channel when happy. Raise the divisor if it's too fast.
do_line_blink  = 2
line_blink_div = 1000
line_blink_ms  = 30
estop_active_low = true            # wire E-stop normally-closed: LOW = tripped

# ── shutdown button ───────────────────────────────────────────────────────────
# Momentary on EL1008 (slave 2) channel 1 (= bit 0). A press (>hold_s debounce)
# → clean poweroff; the OS shutdown fires poweroff-pi.service, taking the Pi
# down too. Read separately from din, so it does NOT arm the E-stop/endstop logic.
pos_shutdown    = 2
di_shutdown     = 0
shutdown_hold_s = 0.1

# ── absolute home ─────────────────────────────────────────────────────────────
# Taught home offset (raw counts) is stored here. Drive must be in multi-turn
# absolute mode (C00.07 = 2, done 2026-06-27). Missing file = wake-zero fallback.
home_file = /var/lib/xylod/home_counts

# ── control loop ──────────────────────────────────────────────────────────────
cycle_us = 1000                    # 1 kHz — matches drive SYNC0 (C13.05 = 2!)
rt_prio  = 60                      # SCHED_FIFO
